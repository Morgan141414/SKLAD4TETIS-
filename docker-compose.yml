services:
  api:
    build: .
    environment:
      SKLAD_DEPLOYMENT_MODE: staging
      SKLAD_DATABASE_BACKEND: postgresql
      SKLAD_DATABASE_URL: postgresql+psycopg://sklad:sklad_dev_password@postgres:5432/sklad
      SKLAD_DEV_AUTH_ENABLED: "false"
      SKLAD_JWT_HMAC_SECRET: ${SKLAD_JWT_HMAC_SECRET:-change-this-staging-secret}
      SKLAD_BACKGROUND_JOBS_ENABLED: "true"
    ports:
      - "8120:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sklad
      POSTGRES_USER: sklad
      POSTGRES_PASSWORD: sklad_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./app/db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sklad -d sklad"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
